[project]
name = "repopilot-api"
version = "0.1.0"
description = "RepoPilot FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.116.1,<1.0.0",
    "openai>=2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3.0",
    "pytest>=8.4.1,<9.0.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "database: requires a migrated live PostgreSQL database",
]
