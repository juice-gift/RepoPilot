services:
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: repopilot-api:local
    environment: &api_environment
      ENVIRONMENT: deployment
      DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL with database hostname}
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-8080}
      REPOSITORY_ALLOWED_ROOT: /repositories
      EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER:-deterministic}
      GENERATION_PROVIDER: ${APP_GENERATION_PROVIDER:-deterministic}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
    volumes:
      - ./apps/api/evaluation:/repositories:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/database', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  migrate:
    profiles: [app]
    image: repopilot-api:local
    environment: *api_environment
    command: [alembic, upgrade, head]
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6


